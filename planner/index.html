<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<meta name="description" content="Daily planner with Google Calendar sync">
<meta name="theme-color" content="#141615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.gisLoaded&&gisLoaded()"></script>
<style>
/* Layout: three panes — ritual sidebar | horizontally scrolling day columns | single-day hourly timeline */
:root{
  --bg:#f3f4f2; --panel:#eaecea; --card:#ffffff; --line:#d9ddd9; --fg:#1c201e; --muted:#69716c;
  --accent:#4a5bd0; --accent-soft:#e3e6fa; --ok:#2c9a5b; --warn:#b97a06; --danger:#cc4136;
  --evt:#cfe6e2; --evt-fg:#174a43; --hatch:rgba(0,0,0,.06); --shadow:0 1px 2px rgba(20,30,25,.08);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141615; --panel:#1a1d1b; --card:#232725; --line:#2f3431; --fg:#e7eae8; --muted:#8c958f;
  --accent:#8e9cf3; --accent-soft:#2b3150; --ok:#4cc27e; --warn:#e3a43a; --danger:#ec6a5f;
  --evt:#244a45; --evt-fg:#cfeee8; --hatch:rgba(255,255,255,.06); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --panel:#1a1d1b; --card:#232725; --line:#2f3431; --fg:#e7eae8; --muted:#8c958f;
  --accent:#8e9cf3; --accent-soft:#2b3150; --ok:#4cc27e; --warn:#e3a43a; --danger:#ec6a5f;
  --evt:#244a45; --evt-fg:#cfeee8; --hatch:rgba(255,255,255,.06); --shadow:none; color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{box-sizing:border-box;display:grid;grid-template-columns:210px minmax(0,1fr) 300px;height:100%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{font-weight:600;font-size:16px;padding:2px 8px}
.navgrp{display:flex;flex-direction:column;gap:1px}
.navlbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 8px}
.nav{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;text-align:left;width:100%}
.nav:hover{background:var(--line)}
.nav.on{background:var(--card);box-shadow:var(--shadow);font-weight:500}
.nav .r{margin-left:auto;font-size:12px;color:var(--muted)}
.nav .ck{color:var(--ok)}
.badge{font-size:10px;font-weight:600;letter-spacing:.05em;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chadd{display:flex;gap:6px;padding:2px 8px}
.chadd input{flex:1;min-width:0;background:transparent;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;line-height:1.45}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.top select,.top input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;font-size:13px}
.top input{width:160px;min-width:0}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync .s{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .s{background:var(--ok)} .sync.err .s{background:var(--danger)} .sync.busy .s{background:var(--warn)}
.timerpill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-size:12px;max-width:260px}
.timerpill span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--warn);padding:6px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#view{flex:1;min-height:0;overflow:auto}
.board{box-sizing:border-box;display:flex;gap:12px;padding:16px 14px;height:100%;align-items:stretch;width:max-content}
.col{width:268px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0}
.col.objcol{width:230px}
.colhead{padding:2px 4px 4px;cursor:pointer}
.dname{font-size:19px;font-weight:600;text-wrap:balance}
.ddate{color:var(--muted);font-size:13px}
.col.today .dname{color:var(--accent)}
.prog{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
.addrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--muted)}
.addrow .lbl{flex:1;text-align:left}
.addrow input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--fg)}
.tot{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel);color:var(--muted)}
.tot.over{background:var(--warn);color:#1b1404}
.cards{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;min-height:60px;padding-bottom:30px;border-radius:8px}
.cards.drop,.tl.drop,.bl.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);cursor:grab}
.card:hover{border-color:var(--muted)}
.card.done{opacity:.55}
.card.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted)}
.card.ins{box-shadow:0 -3px 0 var(--accent)}
.chips{display:flex;align-items:center;gap:6px;font-size:11px;min-height:16px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 6px;font-weight:500}
.rb{background:var(--panel);color:var(--warn);border-radius:999px;padding:0 6px;font-weight:600}
.dur{margin-left:auto;color:var(--muted);background:var(--panel);border-radius:4px;padding:1px 6px}
.ttl{line-height:1.35;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:inline-grid;place-items:center;flex:none;font-size:11px;color:transparent}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{margin-left:auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.colfoot{font-size:12px;color:var(--muted);padding:0 4px}
.empty{color:var(--muted);font-size:13px;padding:10px 4px;line-height:1.5}
.obj{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.obj .t{flex:1;min-width:0;overflow-wrap:anywhere}
.obj small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cal{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.calhead{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.calhead .d{font-weight:600;flex:1;font-size:15px}
.ib{width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--line);color:var(--fg)}
.allday{display:flex;flex-direction:column;gap:3px;padding:6px 12px;border-bottom:1px solid var(--line);min-height:8px}
.ad{background:var(--c,var(--ok));color:#fff;border-radius:4px;padding:2px 8px;font-size:12px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlwrap{flex:1;overflow-y:auto;min-height:0}
.tlrow{display:flex;position:relative}
.gut{width:46px;flex:none;position:relative}
.gut span{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-50%);font-family:var(--mono)}
.tl{position:relative;flex:1;min-width:0;cursor:copy}
.tlgrid{position:absolute;inset:0;pointer-events:none}
.blk{position:absolute;border-radius:5px;padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden;text-align:left;cursor:pointer;border-left:3px solid var(--accent)}
.blk.task{background:color-mix(in srgb,var(--c) 26%,var(--card));border-left-color:var(--c)}
.blk.task.done{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.blk.event{background:color-mix(in srgb,var(--c,var(--evt-fg)) 22%,var(--card));color:var(--fg);border-left-color:var(--c,var(--evt-fg))}
.blk.cancelled{background:transparent;border:1px solid var(--line);color:var(--muted);text-decoration:line-through}
.blk b{font-weight:500;display:block}
.blk em{font-style:normal;opacity:.75;font-family:var(--mono);font-size:10px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);pointer-events:none;z-index:3}
.now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.wcal{display:flex;min-width:760px}
.wcal .dcol{flex:1;min-width:100px;border-left:1px solid var(--line)}
.wcal .dh{position:sticky;top:0;background:var(--bg);z-index:4;padding:8px;border-bottom:1px solid var(--line);font-size:13px;height:56px;box-sizing:border-box;overflow:hidden}
.wcal .dh.today b{color:var(--accent)}
.page{max-width:820px;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));margin:0 auto}
.page h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.page .sub{color:var(--muted);margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:7px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;flex-wrap:wrap}
.lrow .t{flex:1;min-width:140px;overflow-wrap:anywhere}
.lrow .m{color:var(--muted);font-size:12px}
.sect{margin:22px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px;font-family:var(--mono)}
.stat span{font-size:12px;color:var(--muted)}
.focus{max-width:640px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.focus h1{font-size:28px;margin:0;text-wrap:balance}
.bigtime{font-family:var(--mono);font-size:56px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.focus .subs{width:100%;text-align:left}
#modal{position:fixed;inset:0;background:rgba(10,14,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet.wide{width:min(760px,100%)}
.sh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.sh h2{font-size:16px;margin:0;flex:1}
.sb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg)}
.titlein{font-size:18px;font-weight:500;border:0;background:transparent;width:100%;outline:none;padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px;font-size:13px;color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.45}
.sub-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.sub-row .t{flex:1;min-width:0}
.sub-row.done .t{text-decoration:line-through;color:var(--muted)}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 8px;border-radius:999px;background:var(--panel)}
.steps span.on{background:var(--accent);color:#fff}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%}
.help{font-size:12px;color:var(--muted);line-height:1.5}
ol.help{padding-left:18px;margin:0}
ol.help li{margin:4px 0}
code{font-family:var(--mono);font-size:12px;background:var(--panel);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
.calrow{display:flex;align-items:center;gap:10px;padding:5px 0}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 24px)}
.toast{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;font-size:13px}
.toast b{display:block}
.toast small{color:var(--muted)}
@media (max-width:1000px){#app{grid-template-columns:190px minmax(0,1fr)} .cal{display:none} .cal.show{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(320px,90%);z-index:40;padding-top:env(safe-area-inset-top,0px)}}
@media (max-width:640px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));gap:6px;border-right:0;border-bottom:1px solid var(--line)}
  .side .navlbl,.side .sidefoot,.side .chgrp,.brand{display:none}
  .navgrp{flex-direction:row}
  .nav{white-space:nowrap}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top input{width:110px}
  .col{width:250px}
}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
#app.noside{grid-template-columns:minmax(0,1fr) 300px} #app.noside .side{display:none}
#app.nocal{grid-template-columns:210px minmax(0,1fr)} #app.nocal .cal{display:none}
#app.noside.nocal{grid-template-columns:minmax(0,1fr)}
.cm{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:5px;width:250px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;font-size:13px;box-sizing:border-box}
.cm .it{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:6px;text-align:left;box-sizing:border-box}
.cm .it:hover,.cm .it:focus-visible{background:var(--accent-soft);outline:none}
.cm .it.danger{color:var(--danger)}
.cm kbd,.keys kbd,.pal kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
.cm .sep{height:1px;background:var(--line);margin:4px 2px}
.cm .lbl{font-size:11px;color:var(--muted);padding:4px 10px 2px;letter-spacing:.04em;text-transform:uppercase}
.cm .chiprow{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 6px}
.cm .chiprow button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;display:inline-flex;gap:5px;align-items:center}
.cm .chiprow button.on{border-color:var(--accent);background:var(--accent-soft)}
.pal .row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer}
.pal .row.hl{background:var(--accent-soft)}
.pal input{width:100%;box-sizing:border-box;font-size:15px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 18px;outline:none}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:13px}
.keys div{display:flex;gap:8px;align-items:center;padding:3px 0}
#lock{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;place-items:center;padding:16px}
#lock .box{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#lock h1{margin:0;font-size:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div id="note"></div>
    <div id="view"></div>
  </main>
  <section class="cal" id="cal"></section>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<div id="lock" hidden></div>
<div id="cm" class="cm" hidden role="menu"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
const todayStr=()=>ds(new Date());
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const fmtDur=m=>{m=Math.max(0,Math.round(m||0));return `${Math.floor(m/60)}:${pad(m%60)}`};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fmtClock=t=>{const m=toMin(t);let h=Math.floor(m/60),mm=m%60;const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${pad(mm)} ${ap}`};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayName=s=>DAYS[parseD(s).getDay()];
const monDay=s=>{const d=parseD(s);return `${MONTHS[d.getMonth()]} ${d.getDate()}`};

const COLS=['tasks','events','channels','objectives','rituals','recurrences','meta'];
const FORMAT="Planner data file, synced by the Planner web app. data.<collection>.<id> = record. tasks {title, date 'YYYY-MM-DD' or null (backlog), startTime 'HH:MM' or null, planned (minutes), actual (minutes), done, doneOn, channel (channels id), notes, subtasks [{t,done}], objective (objectives id), order (number, sort within day), rollover (days carried over), archived, recurId}; channels {name, color}; objectives {title, week (Monday 'YYYY-MM-DD'), done}; rituals (id = date, or 'w'+Monday) {planned, shutdown, highlight, note, reviewed, reviewNote}; recurrences {title, channel, planned, startTime, freq daily|weekdays|weekly|monthly, start, skip[]}; events = local-only events {title,date,start,end,allDay,cancelled}; meta.settings {limit (minutes/day), plannerCalId}. Every record has updatedAt (ms since epoch): set it to the current time on any edit so the edit wins the merge. To delete a record, remove it from data and add tombstones.<collection>.<id> = current ms. New ids: short strings of letters/digits.";

  COLS.forEach(c=>{const rd=o?.data?.[c]||{},rt=o?.tombstones?.[c]||{};const ids=new Set([...Object.keys(rd),...Object.keys(rt),...S[c].keys(),...T[c].keys()]);const NS=new Map(),NT=new Map();
    for(const id of ids){const cand=[];
      if(rd[id])cand.push({r:1,ts:+rd[id].updatedAt||0,rec:rd[id]});
      if(rt[id]!=null)cand.push({r:1,ts:+rt[id]||0,dead:1});
      if(S[c].has(id))cand.push({r:0,ts:+S[c].get(id).updatedAt||0,rec:S[c].get(id)});
      if(T[c].has(id))cand.push({r:0,ts:T[c].get(id),dead:1});
      cand.sort((a,b)=>b.ts-a.ts||b.r-a.r);const w=cand[0];
      if(!w.r)localNewer=true;
      if(w.r&&JSON.stringify(w.rec||null)!==JSON.stringify(S[c].get(id)||null))changedAny=true;
      if(w.dead){if(w.ts>cutoff)NT.set(id,w.ts)}else NS.set(id,w.rec)}
    S[c]=NS;T[c]=NT});
  if(localNewer)dirty=true;saveLocal(true);return changedAny}

function undo(){const g=undoStack.pop();if(!g||!g.length){toast('Nothing to undo','');return}noUndo++;try{for(const{col,id,prev} of [...g].reverse()){if(prev){const{updatedAt,...rest}=prev;put(col,id,rest)}else if(S[col].has(id))remove(col,id)}}finally{noUndo--}toast('Undone','')}

function rollover(){const t=todayStr();for(const[id,x] of S.tasks){if(x.date&&x.date<t&&!x.done&&!x.archived){
  if(x.recurId)patch('tasks',id,{archived:true,archivedOn:t});
  else patch('tasks',id,{date:t,rollover:(x.rollover||0)+1,startTime:null})}}}
function recurMatches(r,d){if(d<r.start)return false;const D=parseD(d),S0=parseD(r.start);
  if(r.freq==='daily')return true;if(r.freq==='weekdays')return D.getDay()>0&&D.getDay()<6;
  if(r.freq==='weekly')return D.getDay()===S0.getDay();if(r.freq==='monthly')return D.getDate()===S0.getDate();return false}
function genRecurring(){const t=todayStr();for(const[rid,r] of S.recurrences){for(let i=0;i<7;i++){const d=addDays(t,i);
  if(!recurMatches(r,d)||(r.skip||[]).includes(d))continue;
  const tid=`r-${rid}-${d}`;
  if(S.tasks.has(tid)||T.tasks.has(tid)||[...S.tasks.values()].some(x=>x.recurId===rid&&x.date===d))continue;
  newTask({title:r.title,date:d,channel:r.channel||null,planned:r.planned||0,startTime:r.startTime||null,recurId:rid},tid)}}}
function startup(){noUndo++;try{rollover();genRecurring()}finally{noUndo--}}

      else{const b='plb'+uid();const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FILE,mimeType:'application/json',description:'Planner app data. Edit with care; see _format.'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(serialize(),null,1)}\r\n--${b}--`;
        dirty=false;const c=await gfetch(`${UPLOAD}?uploadType=multipart&fields=id,version`,{method:'POST',body,headers:{'Content-Type':'multipart/related; boundary='+b}});fileId=c.id;remoteVersion=String(c.version)}

  }catch(e){if(e.status===404){fileId=null;ls.del('pl-file')}if(!e.auth)setSync('err','Sync error, retrying');console.error(e)}

function reconcilePlanner(items){for(const e of items){const tid=e.extendedProperties?.private?.taskId;if(!tid)continue;
  if(T.tasks.has(tid)){delEvent(tid).catch(()=>{});continue}
  const t=S.tasks.get(tid);if(!t||!e.start?.dateTime)continue;
  if(Date.parse(e.updated)>(t.updatedAt||0)+10000){const s=new Date(e.start.dateTime),en=new Date(e.end.dateTime);
    const nd=ds(s),ns=fromMin(s.getHours()*60+s.getMinutes()),np=Math.round((en-s)/60000);

async function delEvent(id){try{await gfetch(`${CAL}/calendars/${encodeURIComponent(plannerCalId())}/events/${evId(id)}`,{method:'DELETE'})}catch(e){if(e.status!==404&&e.status!==410)throw e}}
async function pushCal(){if(!hasToken()||!plannerCalId()||calPushBusy)return;calPushBusy=true;let synced={};try{synced=JSON.parse(ls.get('pl-calsync')||'{}')}catch{}
  try{for(const[id,t] of S.tasks){const want=!!(t.date&&t.startTime&&!t.archived);const h=want?JSON.stringify([t.title,t.date,t.startTime,t.planned,t.done,t.notes||'']):'';
      if((synced[id]||'')===h)continue;
      if(want)await upsertEvent(id,t);else await delEvent(id);
      if(h)synced[id]=h;else delete synced[id]}
    for(const id of Object.keys(synced))if(!S.tasks.has(id)){await delEvent(id);delete synced[id]}}
  catch(e){console.error(e)}finally{ls.set('pl-calsync',JSON.stringify(synced));calPushBusy=false}}

/* combined events (Google + local) for one day */
function eventsOn(date){const out=[];
  for(const[id,e] of S.events)if(e.date===date)out.push({...e,src:'l',key:'l|'+id,editable:true});
  for(const e of gEvents)if(e.date===date)out.push(e);return out}
function eventByKey(k){if(k.startsWith('l|')){const e=S.events.get(k.slice(2));return e?{...e,src:'l',key:k,editable:true}:null}return gEvMap.get(k)||null}

/* ---------- timeline ---------- */
function layout(items){items.sort((a,b)=>a.s-b.s||b.e-a.e);let cluster=[],cols=[],end=-1;
  const flush=()=>{const n=cols.length;cluster.forEach(i=>i.n=n);cluster=[];cols=[]};
  for(const it of items){if(it.s>=end&&cluster.length)flush();let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(it.e)}else cols[c]=it.e;it.c=c;cluster.push(it);end=Math.max(end,it.e)}
  flush();return items}
function timelineHTML(date,H,labels){const items=[];
  for(const e of eventsOn(date))if(!e.allDay&&e.start&&e.end)items.push({k:'event',id:e.key,s:toMin(e.start),e:Math.max(toMin(e.end),toMin(e.start)+15),title:e.title,x:e});
  for(const[id,t] of S.tasks)if(t.date===date&&t.startTime&&!t.archived&&matches(t)){const s=toMin(t.startTime);items.push({k:'task',id,s,e:Math.min(s+Math.max(t.planned||30,15),1440),title:t.title,x:t})}
  layout(items);
  const grid=`<div class="tlgrid" style="background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px ${H}px)"></div>`;
  const blocks=items.map(it=>{const top=it.s/60*H,ht=Math.max((it.e-it.s)/60*H-2,14);
    const col=it.k==='task'?chColor(it.x.channel):(it.x.color||'');
    const style=`top:${top}px;height:${ht}px;left:calc(${it.c/it.n*100}% + 2px);width:calc(${100/it.n}% - 5px)${col?`;--c:${esc(col)}`:''}`;
    const cls=it.k==='task'?`task ${it.x.done?'done':''}`:`event ${it.x.cancelled?'cancelled':''}`;
    const drag=it.k==='task'||it.x.editable;
    return `<button class="blk ${cls}" style="${style}" draggable="${drag}" data-drag="${it.k}:${esc(it.id)}" data-act="${it.k==='task'?'open':'open-event'}" data-id="${esc(it.id)}" title="${esc(it.title)}${it.x.calName?' · '+esc(it.x.calName):''}"><b>${it.k==='task'&&it.x.done?'✓ ':''}${esc(it.title)}</b><em>${fmtClock(fromMin(it.s))}–${fmtClock(fromMin(it.e%1440))}</em></button>`}).join('');
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const now=date===todayStr()?`<div class="now" style="top:${nowM/60*H}px"></div>`:'';
  const gut=labels?`<div class="gut" style="height:${24*H}px">${Array.from({length:23},(_,i)=>`<span style="top:${(i+1)*H}px">${(i+1)%12||12} ${i+1<12?'AM':'PM'}</span>`).join('')}</div>`:'';
  return `<div class="tlrow">${gut}<div class="tl" data-drop="tl" data-date="${date}" style="height:${24*H}px">${grid}${blocks}${now}</div></div>`}
function allDayHTML(date,small){return eventsOn(date).filter(e=>e.allDay).map(e=>`<button class="ad" style="${e.color?`--c:${esc(e.color)};`:''}${small?'display:block;margin-top:3px;width:100%;font-size:11px':''}" data-act="open-event" data-id="${esc(e.key)}">${esc(e.title)}</button>`).join('')}

function reviewHTML(){const wk=reviewWeek,days=Array.from({length:7},(_,i)=>addDays(wk,i));

function focusHTML(){const t=todayStr();const today=tasksOn(t).filter(([,x])=>!x.done);

   </div>
   <div><div class="fld" style="margin-bottom:4px">Subtasks</div>${(t.subtasks||[]).map((s,i)=>`<div class="sub-row ${s.done?'done':''}"><button class="chk ${s.done?'on':''}" data-act="sub-toggle" data-id="${id}" data-i="${i}" aria-label="Toggle subtask">✓</button><span class="t">${esc(s.t)}</span><button class="ib" data-act="sub-del" data-id="${id}" data-i="${i}" aria-label="Delete subtask">×</button></div>`).join('')}

   <div class="sf"><button class="btn danger" data-act="del" data-id="${id}">Delete</button><button class="btn" data-act="archive" data-id="${id}">Archive</button><button class="btn" data-act="to-backlog" data-id="${id}">Move to backlog</button><button class="btn pri" data-act="modal-close">Done</button></div></div>`,'task')}
function saveDetail(field){const id=detailId,t=S.tasks.get(id);if(!t)return;const v=document.getElementById('d-'+field)?.value;if(v===undefined)return;
  if(field==='title'){if(v.trim()&&v.trim()!==t.title)patch('tasks',id,{title:v.trim()})}
  else if(field==='date')patch('tasks',id,{date:v||null,order:nextOrder(v||null)});
  else if(field==='start')patch('tasks',id,{startTime:v||null});
  else if(field==='planned'||field==='actual'){const d=parseDur(v);if(d!==null&&d!==t[field])patch('tasks',id,{[field]:d})}
  else if(field==='channel')patch('tasks',id,{channel:v||null});
  else if(field==='obj')patch('tasks',id,{objective:v||null});
  else if(field==='notes'){if(v!==(t.notes||''))patch('tasks',id,{notes:v})}
  else if(field==='repeat'){if(!v){if(t.recurId){remove('recurrences',t.recurId);for(const[oid,o] of S.tasks)if(o.recurId===t.recurId&&oid!==id&&!o.done&&o.date>todayStr())remove('tasks',oid);patch('tasks',id,{recurId:null})}}
    else{const rid=t.recurId||uid();put('recurrences',rid,{title:t.title,channel:t.channel||null,planned:t.planned||0,startTime:t.startTime||null,freq:v,start:t.date||todayStr(),skip:(S.recurrences.get(rid)?.skip)||[]});
      if(!t.date)patch('tasks',id,{date:todayStr()});patch('tasks',id,{recurId:rid});genRecurring()}}}

let evEditKey=null;
function openEvent(key,preset){const e=key?eventByKey(key):null;if(key&&!e)return;evEditKey=key;
  const isNew=!key,useG=isNew?hasToken():e.src==='g';
  const d=e||{title:'',date:calDate,start:'09:00',end:'10:00',allDay:false,cancelled:false,...preset};
  const ro=e&&!e.editable?'disabled':'';
  const writable=cals.filter(c=>['owner','writer'].includes(c.accessRole)&&c.id!==plannerCalId());
  const calSel=isNew&&useG?`<label class="fld">Calendar<select id="e-cal">${writable.map(c=>`<option value="${esc(c.id)}" ${c.primary?'selected':''}>${esc(c.summaryOverride||c.summary)}</option>`).join('')}</select></label>`:'';
  openModal(`<div class="sheet" role="dialog" aria-label="Event"><div class="sh"><h2>${isNew?'New event':esc(e.calName||'Event')}</h2><button class="ib" data-act="modal-close" aria-label="Close">×</button></div>
  <div class="sb"><input class="titlein" id="e-title" value="${esc(d.title)}" placeholder="Event title" aria-label="Event title" ${isNew?'autofocus':''} ${ro}>
  <div class="grid"><label class="fld">Day<input type="date" id="e-date" value="${d.date}" ${ro||(e&&e.allDay?'disabled':'')}></label>${d.allDay&&!isNew?'':`<label class="fld">Start<input type="time" id="e-start" value="${d.start||'09:00'}" step="300" ${ro}></label><label class="fld">End<input type="time" id="e-end" value="${d.end||'10:00'}" step="300" ${ro}></label>`}${calSel}</div>
  ${isNew||e.src==='l'?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e-allday" ${d.allDay?'checked':''}> All day</label>`:''}
  ${e&&e.src==='l'?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e-cancelled" ${d.cancelled?'checked':''}> Cancelled</label>`:''}
  ${e&&e.cancelled&&e.src==='g'?'<div class="help">You declined this event.</div>':''}
  ${e&&e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">Open in Google Calendar</a>`:''}
  ${isNew&&!useG?'<div class="help">Saved on this device only. Sign in with Google to add events to your calendars.</div>':''}</div>
  <div class="sf">${e&&e.editable?`<button class="btn danger" data-act="ev-del">Delete</button>`:''}${e?`<button class="btn" data-act="ev-task">Add as task</button>`:''}${!e||e.editable?`<button class="btn pri" data-act="ev-save">Save</button>`:'<button class="btn pri" data-act="modal-close">Close</button>'}</div></div>`,'event')}
async function saveEvent(){const key=evEditKey,e=key?eventByKey(key):null;const g=k=>document.getElementById('e-'+k);
  const title=g('title').value.trim()||'Untitled event',date=g('date').value||calDate;let s=g('start')?.value||'09:00',en=g('end')?.value||'10:00';
  if(toMin(en)<=toMin(s))en=fromMin(Math.min(toMin(s)+30,1439));const allDay=g('allday')?.checked||false;
  const gTimes=()=>allDay?{start:{date},end:{date:addDays(date,1)}}:{start:{dateTime:`${date}T${s}:00`,timeZone:TZ},end:{dateTime:`${date}T${en}:00`,timeZone:TZ}};
  try{
    if(!e&&hasToken()){const cal=g('cal')?.value||'primary';await gfetch(`${CAL}/calendars/${encodeURIComponent(cal)}/events`,{method:'POST',body:JSON.stringify({summary:title,...gTimes()})});closeModal();fetchEvents(true);toast('Event added',title);return}
    if(e&&e.src==='g'){const body={summary:title};if(!e.allDay)Object.assign(body,gTimes());await gfetch(`${CAL}/calendars/${encodeURIComponent(e.calId)}/events/${e.gid}`,{method:'PATCH',body:JSON.stringify(body)});closeModal();fetchEvents(true);return}
    put('events',e?key.slice(2):uid(),{title,date,start:s,end:en,allDay,cancelled:g('cancelled')?.checked||false});closeModal()
  }catch(err){toast('Could not save the event',err.auth?'Reconnect Google and try again.':'Google Calendar refused the change.')}}

/* daily plan ritual */
let planStep=0;
function meetingMins(date){return eventsOn(date).filter(e=>!e.allDay&&!e.cancelled).reduce((a,e)=>a+Math.max(0,toMin(e.end)-toMin(e.start)),0)}
function openPlan(step){planStep=step??planStep;const t=todayStr(),y=addDays(t,-1);const steps=['Yesterday','Today\'s tasks','Workload','Done'];
  const head=`<div class="sh"><h2>Plan ${dayName(t)}</h2><button class="ib" data-act="modal-close" aria-label="Close">×</button></div><div class="sb"><div class="steps">${steps.map((s,i)=>`<span class="${i===planStep?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  let body='';const today=tasksOn(t);
  if(planStep===0){const doneY=[...S.tasks.values()].filter(x=>x.done&&(x.doneOn||x.date)===y);const rolled=today.filter(([,x])=>x.rollover);
    body=`<div class="sect" style="margin-top:0">Finished yesterday (${doneY.length})</div><div class="list">${doneY.map(x=>`<div class="lrow"><span class="t">${esc(x.title)}</span><span class="m mono">${fmtDur(x.actual||x.planned)}</span></div>`).join('')||'<div class="empty">Nothing logged for yesterday.</div>'}</div>
    <div class="sect">Carried over to today (${rolled.length})</div><div class="list">${rolled.map(([id,x])=>rowHTML(id,x,`<span class="rb">↻${x.rollover}</span><button class="btn sm" data-act="to-backlog" data-id="${id}" data-re="plan">Backlog</button><button class="btn sm" data-act="archive" data-id="${id}" data-re="plan">Archive</button>`)).join('')||'<div class="empty">Nothing carried over.</div>'}</div>`}
  else if(planStep===1){const bl=[...S.tasks].filter(([,x])=>!x.date&&!x.archived&&!x.done);
    body=`<div class="addrow"><input id="plan-add" placeholder="Add a task for today #channel ~1h @2pm" aria-label="Add task for today" autofocus></div>
    <div class="list">${today.map(([id,x])=>rowHTML(id,x,`<input class="inp mono" style="width:60px" data-plan-dur="${id}" value="${fmtDur(x.planned)}" aria-label="Planned time">`)).join('')||'<div class="empty">No tasks yet.</div>'}</div>
    ${bl.length?`<div class="sect">From backlog</div><div class="list">${bl.map(([id,x])=>rowHTML(id,x,`<button class="btn sm" data-act="sched" data-id="${id}" data-d="0" data-re="plan">＋ Today</button>`)).join('')}</div>`:''}
    <div class="help">Type the planned time as h:mm, 45m or 1.5h.</div>`}
  else if(planStep===2){const tot=planned(today),lim=settings().limit;const meet=meetingMins(t);const all=tot+meet;const pct=Math.min(100,all/Math.max(lim,1)*100);
    body=`<p style="margin:0">Tasks <b class="mono">${fmtDur(tot)}</b> + meetings <b class="mono">${fmtDur(meet)}</b> = <b class="mono">${fmtDur(all)}</b> of your <input id="plan-limit" class="inp mono" style="width:60px" value="${fmtDur(lim)}" aria-label="Daily workload limit"> limit.</p>
    <div class="meter"><i style="width:${pct}%;background:${all>lim?'var(--warn)':'var(--ok)'}"></i></div>
    <p class="help" style="margin:0">${all>lim?`You're ${fmtDur(all-lim)} over. Move some tasks to another day.`:`You have ${fmtDur(lim-all)} unplanned.`}</p>
    <div class="list">${today.filter(([,x])=>!x.done).map(([id,x])=>rowHTML(id,x,`<button class="btn sm" data-act="sched" data-id="${id}" data-d="1" data-re="plan">Tomorrow</button><button class="btn sm" data-act="to-backlog" data-id="${id}" data-re="plan">Backlog</button>`)).join('')}</div>
    <div class="help">Drag tasks onto the calendar panel afterwards to timebox them.</div>`}
  else body=`<h2 style="margin:0">Today is planned.</h2><p class="help">${today.length} tasks, ${fmtDur(planned(today))} planned. Press F to start the first one.</p>`;
  const foot=`</div><div class="sf">${planStep>0&&planStep<3?'<button class="btn" data-act="plan-back">Back</button>':''}${planStep<2?'<button class="btn pri" data-act="plan-next">Next</button>':planStep===2?'<button class="btn pri" data-act="plan-finish">Finish planning</button>':'<button class="btn pri" data-act="modal-close">Close</button>'}</div>`;
  openModal(`<div class="sheet wide" role="dialog" aria-label="Daily planning">${head}${body}${foot}</div>`,'plan')}

/* shutdown ritual */
let shutStep=0;
function openShutdown(step){shutStep=step??shutStep;const t=todayStr();const today=tasksOn(t);const done=today.filter(([,x])=>x.done),open=today.filter(([,x])=>!x.done);const r=ritual(t);
  const act=done.reduce((a,[,x])=>a+(x.actual||x.planned||0),0);
  let body='';
  if(shutStep===0)body=`<div class="stats"><div class="stat"><b>${done.length}/${today.length}</b><span>tasks done</span></div><div class="stat"><b>${fmtDur(act)}</b><span>time on completed tasks</span></div><div class="stat"><b>${fmtDur(planned(today))}</b><span>planned</span></div></div>
    <div class="sect">Done</div><div class="list">${done.map(([id,x])=>rowHTML(id,x)).join('')||'<div class="empty">Nothing marked done.</div>'}</div>
    <div class="sect">Not done (${open.length}) ${open.length?'<button class="btn sm" data-act="shut-moveall">Move all to tomorrow</button>':''}</div>
    <div class="list">${open.map(([id,x])=>rowHTML(id,x,`<button class="btn sm" data-act="sched" data-id="${id}" data-d="1" data-re="shut">Tomorrow</button><button class="btn sm" data-act="to-backlog" data-id="${id}" data-re="shut">Backlog</button><button class="btn sm" data-act="archive" data-id="${id}" data-re="shut">Archive</button>`)).join('')||'<div class="empty">Everything is done.</div>'}</div>
    <div class="help">Anything left here rolls over to tomorrow at midnight.</div>`;
  else if(shutStep===1)body=`<label class="fld">Highlight of the day<input id="sh-hl" value="${esc(r.highlight||'')}" placeholder="One thing that went well"></label>
    <label class="fld">Reflection<textarea id="sh-note" placeholder="What got in the way? What should tomorrow start with?">${esc(r.note||'')}</textarea></label>`;
  else body=`<h2 style="margin:0">Shutdown complete.</h2><p class="help">${done.length} tasks done today. Tomorrow has ${tasksOn(addDays(t,1)).length} tasks queued.</p>`;
  openModal(`<div class="sheet wide" role="dialog" aria-label="Daily shutdown"><div class="sh"><h2>Shut down ${dayName(t)}</h2><button class="ib" data-act="modal-close" aria-label="Close">×</button></div><div class="sb"><div class="steps">${['Review','Reflect','Done'].map((s,i)=>`<span class="${i===shutStep?'on':''}">${i+1}. ${s}</span>`).join('')}</div>${body}</div>
   <div class="sf">${shutStep===1?'<button class="btn" data-act="shut-back">Back</button>':''}${shutStep===0?'<button class="btn pri" data-act="shut-next">Next</button>':shutStep===1?'<button class="btn pri" data-act="shut-finish">Finish shutdown</button>':'<button class="btn pri" data-act="modal-close">Close</button>'}</div></div>`,'shut')}

/* weekly plan */

/* ---------- actions ---------- */
function toggleTask(id){const t=S.tasks.get(id);if(!t)return;const done=!t.done;const p={done,doneOn:done?todayStr():null};

function autoSchedule(id){const t=S.tasks.get(id);const date=t.date&&t.date>=todayStr()?t.date:todayStr();const dur=Math.max(t.planned||30,15);
  const now=new Date();let from=date===todayStr()?Math.max(8*60,Math.ceil((now.getHours()*60+now.getMinutes())/15)*15):9*60;
  const busy=eventsOn(date).filter(e=>!e.allDay&&!e.cancelled).map(e=>[toMin(e.start),toMin(e.end)]);
  for(const[oid,o] of S.tasks)if(oid!==id&&o.date===date&&o.startTime&&!o.archived)busy.push([toMin(o.startTime),toMin(o.startTime)+Math.max(o.planned||30,15)]);
  busy.sort((a,b)=>a[0]-b[0]);let s=from;for(const[a,b] of busy){if(a>=s+dur)break;if(b>s)s=Math.ceil(b/15)*15}
  if(s+dur>22*60){toast('No free slot','Nothing open before 10 pm on '+shortDay(date)+'.');return}
  patch('tasks',id,{date,startTime:fromMin(s),order:t.date===date?t.order:nextOrder(date)});calDate=date;toast('Scheduled '+fmtClock(fromMin(s)),t.title)}

    if(el.id==='d-sub'&&el.value.trim()){const t=S.tasks.get(detailId);patch('tasks',detailId,{subtasks:[...(t.subtasks||[]),{t:el.value.trim(),done:false}]});openTask(detailId,'sub');return}
    if(el.id==='obj-add'||el.id==='wp-add'){const v=el.value.trim();if(v){put('objectives',uid(),{title:v,week:el.id==='wp-add'?mondayOf(todayStr()):mondayOf(boardStart),done:false});el.value='';if(el.id==='wp-add'){openWeekPlan();setTimeout(()=>$('#wp-add')?.focus())}}return}
    if(el.id==='newch'){const v=el.value.trim().replace(/^#/,'');if(v){const cid=slug(v);put('channels',cid,{name:v,color:PALETTE[S.channels.size%PALETTE.length]});el.value=''}return}
    if(el.id==='d-title'){el.blur();return}}
  if(k==='Escape'){if(!$('#modal').hidden){const c=$('#modal [data-act="modal-close"]');if(c)c.click();else closeModal();return}if(addingDate){addingDate=null;render();return}if(sel){sel=null;render()}return}
  const typing=['INPUT','TEXTAREA','SELECT'].includes(el.tagName)||el.isContentEditable;
  if(typing)return;
  if((modalKind==='plan'||modalKind==='shut')&&(k==='ArrowRight'||k==='ArrowLeft')){const btn=$(`[data-act="${modalKind}-${k==='ArrowRight'?'next':'back'}"]`)||(k==='ArrowRight'?$(`[data-act="${modalKind==='plan'?'plan-finish':'shut-finish'}"]`):null);btn?.click();e.preventDefault();return}
  if(!$('#modal').hidden)return;
  const id=targetId();const run=(f,...a)=>{e.preventDefault();f(...a)};
  if(mod){const lk=k.toLowerCase();
    if(lk==='z'&&!e.shiftKey)return run(undo);
    if(lk==='f')return run(()=>$('#search').focus());
    if(lk==='s')return run(()=>$(`[data-act="sort"][data-date="${id&&S.tasks.get(id).date||boardStart}"]`)?.click());
    if(k==='Enter'&&id)return run(OPS.open,id);
    if(lk==='d'&&id)return run(OPS.duplicate,id);
    if((k==='Backspace'||k==='Delete')&&id)return run(OPS.del,id);
    if(lk==='x'&&id)return run(OPS.unschedule,id);
    if((k==='ArrowUp'||k==='ArrowDown')&&id)return run(OPS.move,id,k==='ArrowUp'?-1:1,e.shiftKey);
    return}
  if(e.altKey)return;
  switch(k){
    case '?':return run(openHelp);
    case 'a':return run(()=>{const t=todayStr();addingDate=(view==='week'||view==='today')?(boardStart>t?boardStart:t):t;if(view==='backlog'){$('#add-backlog')?.focus();return}if(view!=='week'&&view!=='today')view='week';render()});
    case 'ArrowDown':case 'ArrowUp':return run(navTask,k==='ArrowDown'?1:-1,e.shiftKey);
    case 'ArrowLeft':case 'ArrowRight':return run(e.shiftKey?()=>shiftView(k==='ArrowRight'?1:-1):()=>navDay(k==='ArrowRight'?1:-1));
    case ' ':return run(e.shiftKey?()=>{boardStart=todayStr();calDate=todayStr();render()}:()=>id&&OPS.timer(id));
    case 'c':return id&&run(OPS.complete,id);
    case 'q':return id&&run(openTask,id,'channel');
    case 'w':return id&&run(openTask,id,'planned');
    case 'e':return id&&run(openTask,id,'actual');
    case 'r':return id&&run(openTask,id,'obj');
    case '@':return id&&run(openTask,id,'date');
    case 'v':return id&&run(openTask,id,'sub');
    case 'x':return id&&run(OPS.autoschedule,id);
    case 's':return id&&run(OPS.today,id);
    case 'd':return id&&run(OPS.snooze,id);
    case 'z':return id&&run(OPS.backlog,id);
    case 'Z':return id&&run(OPS.backlogTop,id);
    case 'f':return run(()=>{if(id)focusId=id;goView('focus')});
    case 'h':return run(goView,'week');
    case 'j':return run(goView,'calendar');
    case 't':return run(goView,'today');
    case 'n':return run(goView,'week');
    case 'b':return run(goView,'backlog');
    case 'A':return run(goView,'archive');
    case 'p':return run(openPlan,ritual(todayStr()).planned?3:0);
    case 'o':return run(openShutdown,ritual(todayStr()).shutdown?2:0);
    case 'R':return run(openWeekPlan);
    case 'F':return run(()=>{const s=$('#chfilter');s.focus();try{s.showPicker()}catch{}});
    case '/':return run(()=>$('#search').focus());
    case '<':return run(()=>{hideSide=!hideSide;render()});
    case '>':case 'C':return run(()=>{if(window.innerWidth<=1000)showCal=!showCal;else hideCal=!hideCal;render()});
    case 'L':return run(toggleTheme);
  }});

/* ---------- context menu ---------- */
function closeMenu(){const m=$('#cm');m.hidden=true;m.innerHTML=''}
function openMenu(x,y,html){const m=$('#cm');m.innerHTML=html;m.hidden=false;const r=m.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';m.querySelector('.it')?.focus({preventScroll:true})}
const mi=(op,label,key='',cls='')=>`<button class="it ${cls}" role="menuitem" data-op="${op}">${label}${key?`<kbd>${key}</kbd>`:''}</button>`;
let menuTarget=null;
function taskMenu(id,x,y){const t=S.tasks.get(id);if(!t)return;menuTarget={kind:'task',id};sel=id;render();const tm=timer();
  openMenu(x,y,`${mi('open','Open',M+'↵')}${mi('complete',t.done?'Mark incomplete':'Complete','C')}${mi('timer',tm&&tm.taskId===id?'Stop timer':'Start timer','Space')}${mi('focus','Focus on this','F')}<div class="sep"></div>
  ${t.date!==todayStr()?mi('today','Move to today','S'):''}${mi('snooze','Snooze to tomorrow','D')}${mi('nextweek','Move to next week')}${mi('pickdate','Move to date…','@')}${t.date?mi('backlog','Move to backlog','Z'):''}<div class="sep"></div>
  ${mi('autoschedule',t.startTime?'Reschedule to next free slot':'Schedule on calendar','X')}${t.startTime?mi('unschedule','Remove from calendar',M+'X'):''}
  ${t.date?mi('top','Move to top',M+'⇧↑')+mi('bottom','Move to bottom',M+'⇧↓'):''}<div class="sep"></div>
  ${mi('duplicate','Duplicate',M+'D')}${t.date?mi('dupnext','Copy to next day'):''}${mi('copy','Copy as text')}<div class="sep"></div>
  <div class="lbl">Channel</div><div class="chiprow"><button data-op="ch:" class="${!t.channel?'on':''}">None</button>${[...S.channels].map(([cid,c])=>`<button data-op="ch:${esc(cid)}" class="${t.channel===cid?'on':''}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('')}</div>
  ${mi('objective','Link weekly objective…','R')}<div class="sep"></div>${mi('archive','Archive')}${mi('del','Delete',M+'⌫','danger')}`)}
function dayMenu(date,x,y){menuTarget={kind:'day',date};const open=tasksOn(date).filter(([,t])=>!t.done).length;
  openMenu(x,y,`${mi('d-add','Add task','A')}${mi('d-sort','Sort by start time',M+'S')}${open?mi('d-move',`Move ${open} unfinished to next day`):''}${mi('d-cal','Show in calendar panel')}${date===todayStr()?mi('d-plan','Plan this day','P')+mi('d-shut','Shut down this day','O'):''}`)}
function eventMenu(key,x,y){const e=eventByKey(key);if(!e)return;menuTarget={kind:'event',key};
  openMenu(x,y,`${mi('e-open',e.editable?'Edit event':'View event')}${mi('e-task','Add as task')}${e.link?`<a class="it" role="menuitem" href="${esc(e.link)}" target="_blank" rel="noopener" data-op="e-link">Open in Google Calendar</a>`:''}${e.editable?'<div class="sep"></div>'+mi('e-del','Delete event','','danger'):''}`)}
document.addEventListener('contextmenu',e=>{if(isLocked())return;const el=e.target;if(['INPUT','TEXTAREA'].includes(el.tagName))return;
  const task=el.closest('[data-drag^="task:"]');const ev=el.closest('[data-drag^="event:"],.ad[data-id]');const day=el.closest('[data-date]');
  if(task){e.preventDefault();taskMenu(task.dataset.drag.slice(5),e.clientX,e.clientY)}
  else if(ev){e.preventDefault();eventMenu(ev.dataset.id,e.clientX,e.clientY)}
  else if(day&&el.closest('.col')){e.preventDefault();dayMenu(day.dataset.date,e.clientX,e.clientY)}
  else if(el.closest('#app'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{if(!$('#cm').hidden&&!e.target.closest('#cm'))closeMenu()},true);
window.addEventListener('blur',closeMenu);
$('#cm').addEventListener('click',e=>{const b=e.target.closest('[data-op]');if(!b)return;const op=b.dataset.op;const T0=menuTarget;
  if(op==='e-link'){closeMenu();return}
  e.preventDefault();e.stopPropagation();closeMenu();if(!T0)return;
  if(T0.kind==='task'){const id=T0.id;if(!S.tasks.has(id))return;
    if(op.startsWith('ch:'))return OPS.channel(id,op.slice(3));
    ({open:()=>OPS.open(id),complete:()=>OPS.complete(id),timer:()=>OPS.timer(id),focus:()=>OPS.focus(id),today:()=>OPS.today(id),snooze:()=>OPS.snooze(id),nextweek:()=>OPS.nextweek(id),pickdate:()=>openTask(id,'date'),backlog:()=>OPS.backlog(id),
      autoschedule:()=>OPS.autoschedule(id),unschedule:()=>OPS.unschedule(id),top:()=>OPS.move(id,-1,true),bottom:()=>OPS.move(id,1,true),duplicate:()=>OPS.duplicate(id),dupnext:()=>OPS.duplicate(id,1),copy:()=>OPS.copyText(id),
      objective:()=>openTask(id,'obj'),archive:()=>OPS.archive(id),del:()=>OPS.del(id)})[op]?.()}
  else if(T0.kind==='day'){const d=T0.date;
    ({'d-add':()=>{addingDate=d;render()},'d-sort':()=>$(`[data-act="sort"][data-date="${d}"]`)?.click(),'d-move':()=>{const nd=addDays(d,1);tasksOn(d).filter(([,t])=>!t.done).forEach(([tid])=>patch('tasks',tid,{date:nd,order:nextOrder(nd),startTime:null}));toast('Moved to '+shortDay(nd),'')},
      'd-cal':()=>{calDate=d;showCal=innerWidth<=1000;hideCal=false;render()},'d-plan':()=>openPlan(0),'d-shut':()=>openShutdown(0)})[op]?.()}
  else if(T0.kind==='event'){evEditKey=T0.key;const ev=eventByKey(T0.key);if(!ev)return;
    if(op==='e-open')openEvent(T0.key);
    else if(op==='e-task'){newTask({title:ev.title,date:ev.date,startTime:null,planned:ev.allDay?0:toMin(ev.end)-toMin(ev.start)});toast('Added as a task',ev.title)}
    else if(op==='e-del'){if(ev.src==='l')remove('events',T0.key.slice(2));else gfetch(`${CAL}/calendars/${encodeURIComponent(ev.calId)}/events/${ev.gid}`,{method:'DELETE'}).then(()=>{fetchEvents(true);toast('Event deleted',ev.title)}).catch(()=>toast('Could not delete the event',''))}}});
/* long-press on touch screens opens the same menu */
let lpTimer=null,lpFired=false,lpStart=null;
document.addEventListener('touchstart',e=>{const t=e.target.closest('[data-drag],.ad[data-id],.colhead');if(!t)return;lpFired=false;const p=e.touches[0];lpStart=[p.clientX,p.clientY];
  lpTimer=setTimeout(()=>{lpFired=true;navigator.vibrate?.(10);const x=lpStart[0],y=lpStart[1];
    if(t.dataset.drag?.startsWith('task:'))taskMenu(t.dataset.drag.slice(5),x,y);else if(t.dataset.drag?.startsWith('event:')||t.classList.contains('ad'))eventMenu(t.dataset.id,x,y);else dayMenu(t.dataset.date,x,y)},500)},{passive:true});
document.addEventListener('touchmove',e=>{if(!lpTimer)return;const p=e.touches[0];if(Math.hypot(p.clientX-lpStart[0],p.clientY-lpStart[1])>10){clearTimeout(lpTimer);lpTimer=null}},{passive:true});
document.addEventListener('touchend',e=>{clearTimeout(lpTimer);lpTimer=null;if(lpFired){e.preventDefault();lpFired=false}});
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&!e.target.closest('.chk')&&!e.metaKey&&!e.ctrlKey){sel=c.dataset.id}},true);
document.addEventListener('focusout',e=>{const el=e.target;if(el.id&&el.id.startsWith('add-')&&!el.value.trim()&&addingDate&&el.id==='add-'+addingDate){setTimeout(()=>{if(document.activeElement?.id!==el.id){addingDate=null;render()}},150)}});

/* ---------- drag & drop ---------- */
let drag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[data-drag]');if(!el||el.getAttribute('draggable')!=='true')return;drag=el.dataset.drag;e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.drop,.ins').forEach(x=>x.classList.remove('drop','ins'))});
document.addEventListener('dragover',e=>{if(!drag)return;const z=e.target.closest('[data-drop]');document.querySelectorAll('.drop,.ins').forEach(x=>x.classList.remove('drop','ins'));if(!z)return;
  if(drag.startsWith('event:')&&z.dataset.drop!=='tl')return;e.preventDefault();z.classList.add('drop');const c=e.target.closest('.card');if(c&&z.dataset.drop==='day')c.classList.add('ins')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();const i=drag.indexOf(':');const kind=drag.slice(0,i),id=drag.slice(i+1);
  if(z.dataset.drop==='tl'){const r=z.getBoundingClientRect();const H=r.height/24;const m=Math.max(0,Math.min(1425,Math.round((e.clientY-r.top)/H*60/15)*15));const date=z.dataset.date;
    if(kind==='task'){const t=S.tasks.get(id);patch('tasks',id,{date,startTime:fromMin(m),order:t.date===date?t.order:nextOrder(date)})}
    else{const ev=eventByKey(id);if(ev&&!ev.allDay){const len=toMin(ev.end)-toMin(ev.start);const ne=fromMin(Math.min(m+len,1439));
      if(ev.src==='l')patch('events',id.slice(2),{date,start:fromMin(m),end:ne});
      else{Object.assign(ev,{date,start:fromMin(m),end:ne});scheduleRender();gfetch(`${CAL}/calendars/${encodeURIComponent(ev.calId)}/events/${ev.gid}`,{method:'PATCH',body:JSON.stringify({start:{dateTime:`${date}T${fromMin(m)}:00`,timeZone:TZ},end:{dateTime:`${date}T${ne}:00`,timeZone:TZ}})}).then(()=>fetchEvents(true)).catch(()=>{toast('Could not move the event','');fetchEvents(true)})}}}}
  else if(kind==='task'&&z.dataset.drop==='day'){const date=z.dataset.date;const c=e.target.closest('.card');let order;
    if(c&&c.dataset.id!==id){const l=tasksOn(date).filter(([tid])=>tid!==id);const i2=l.findIndex(([tid])=>tid===c.dataset.id);const after=l[i2][1].order||0,before=i2>0?(l[i2-1][1].order||0):after-2000;order=(after+before)/2}else order=nextOrder(date);
    const t=S.tasks.get(id);patch('tasks',id,{date,order,startTime:t.date===date?t.startTime:null})}
  else if(kind==='task'&&z.dataset.drop==='backlog')patch('tasks',id,{date:null,startTime:null});
  drag=null;document.querySelectorAll('.drop,.ins').forEach(x=>x.classList.remove('drop','ins'))});

/* ---------- toasts, install, clocks ---------- */
function toast(title,sub,actions=''){const d=document.createElement('div');d.className='toast';d.innerHTML=`<div style="flex:1"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>${actions}<button class="ib" data-act="toast-close" aria-label="Dismiss">×</button>`;$('#toasts').appendChild(d);if(!actions)setTimeout(()=>d.remove(),4000);return d}
function maybeShutdownToast(){const t=todayStr();if(new Date().getHours()<17||ritual(t).shutdown)return;if(ls.get('pl-shut-toast')===t||document.querySelector('.toast.shut'))return;ls.set('pl-shut-toast',t);
  toast('Daily shutdown','Wrap up your day','<button class="btn sm pri" data-act="toast-shut">Start</button>').classList.add('shut');
  if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible')try{new Notification('Daily shutdown',{body:'Wrap up your day',icon:'icon-192.png'})}catch{}}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;scheduleRender()});
setInterval(()=>{const tm=timer();if(!tm)return;const p=$('#tpill');if(p)p.textContent=fmtDur((Date.now()-tm.startedAt)/60000);
  const f=$('#focustime');if(f&&focusId===tm.taskId){const t=S.tasks.get(focusId);f.textContent=fmtDur((t?.actual||0)+(Date.now()-tm.startedAt)/60000)}},5000);
window.addEventListener('resize',()=>scheduleRender());
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- init ---------- */
loadLocal();startup();render();maybeShutdownToast();
if(gisReady||window.google?.accounts?.oauth2){gisReady=true;window.gisLoaded()}
</script>
